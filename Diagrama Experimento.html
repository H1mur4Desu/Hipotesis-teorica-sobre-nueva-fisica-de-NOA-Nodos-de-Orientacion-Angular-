<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama: Cosmología Informacional Unificada</title>
<style>
    body { 
        background-color: #0f172a; 
        color: #e2e8f0; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        min-height: 100vh; 
        margin: 0; 
        padding: 20px;
    }
    .container { 
        text-align: center; 
        max-width: 900px; 
        width: 100%; 
    }
    h2 {
        color: #38bdf8;
        font-weight: 300;
        letter-spacing: 1px;
        margin-bottom: 30px;
    }
    svg { 
        width: 100%; 
        height: auto; 
        background-color: #1e293b; 
        border-radius: 12px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        border: 1px solid #334155;
    }
    .node { 
        fill: #0f172a; 
        stroke: #38bdf8; 
        stroke-width: 2; 
        transition: all 0.3s ease; 
    }
    .node:hover { 
        fill: #1e293b; 
        stroke: #0ea5e9;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
        cursor: pointer; 
    }
    .text-title { 
        fill: #f8fafc; 
        font-size: 18px; 
        font-weight: bold; 
        pointer-events: none; 
    }
    .text-desc { 
        fill: #94a3b8; 
        font-size: 14px; 
        pointer-events: none; 
    }
    .highlight {
        fill: #38bdf8;
        font-weight: bold;
    }
    .line { 
        stroke: #64748b; 
        stroke-width: 2; 
        stroke-dasharray: 6,6; 
        animation: dash 20s linear infinite; 
    }
    @keyframes dash { 
        to { stroke-dashoffset: -1000; } 
    }
</style>
</head>
<body>

<div class="container">
    <h2>Estructura Ontológica y Operativa del Deep Hilbert Space</h2>
    
    <svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
            </marker>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
            </marker>
        </defs>
        
        <path d="M 400 160 L 400 240" class="line" marker-end="url(#arrow)"/>
        <path d="M 400 360 L 400 440" class="line" marker-end="url(#arrow)"/>
        
        <path d="M 610 515 C 780 515 780 305 610 305" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)">
            <animate attributeName="stroke-dashoffset" from="100" to="0" dur="3s" repeatCount="indefinite" />
        </path>
        <text x="640" y="415" fill="#38bdf8" font-size="12" font-style="italic">Bucle de Voluntad</text>

        <rect x="100" y="50" width="600" height="110" rx="8" class="node"/>
        <text x="400" y="80" text-anchor="middle" class="text-title">NIVEL 1: Deep Hilbert Space (DHS)</text>
        <text x="400" y="105" text-anchor="middle" class="text-desc">Sustrato informacional decadimensional no-local</text>
        <text x="400" y="125" text-anchor="middle" class="text-desc">Topología de Hiperesfera Inversa: <tspan class="highlight">R · R⁻¹ = 1</tspan></text>
        <text x="400" y="145" text-anchor="middle" class="text-desc">Tejido de Nodos de Orientación Angular (NOA) estructurados en Base-12</text>

        <rect x="100" y="250" width="600" height="110" rx="8" class="node"/>
        <text x="400" y="280" text-anchor="middle" class="text-title">NIVEL 2: Interfaz de Consciencia</text>
        <text x="400" y="305" text-anchor="middle" class="text-desc">Campo de Intención Global (CI) interactuando con la materia</text>
        <text x="400" y="325" text-anchor="middle" class="text-desc">Mecanismo de Transducción: <tspan class="highlight">Núcleo Resonante (Kriptón gaseoso)</tspan></text>
        <text x="400" y="345" text-anchor="middle" class="text-desc">Frecuencia Base Originaria (WOA): φ₁₂ = 10368 Hz</text>

        <rect x="100" y="450" width="600" height="130" rx="8" class="node"/>
        <text x="400" y="480" text-anchor="middle" class="text-title">NIVEL 3: Realidad Física y Medición (RDI)</text>
        <text x="400" y="505" text-anchor="middle" class="text-desc">Colapso Cuántico Exponencial: P'(s) = P(s)exp(γ_Kr C) / Z'</text>
        <text x="400" y="525" text-anchor="middle" class="text-desc">Diseño de Antena: <tspan class="highlight">Receptor Dodecaédrico</tspan> (12 transductores, Simetría Icosaédrica)</text>
        <text x="400" y="545" text-anchor="middle" class="text-desc">Filtrado heterodino para anulación del ruido del Hamiltoniano (H₀)</text>
        <text x="400" y="565" text-anchor="middle" fill="#0ea5e9" font-size="14" font-weight="bold">Detección de Armónicos: f₂ = 20736 Hz | f₃ = 31104 Hz</text>
    </svg>
</div>

</body>
</html>
